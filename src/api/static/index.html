<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepArticle — Academic Paper Analysis</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0b1020; }
    .fade-in { animation: fade .4s ease; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body class="text-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, createContext, useContext } = React;

    // ---------------------------------------------------------------- i18n ----
    const STRINGS = {
      en: {
        subtitle: "Multi-agent academic paper analysis",
        provider: "Provider", sources: "Sources",
        searchPlaceholder: "Enter a research topic…",
        search: "Search", searching: "Searching…",
        emptyHint: "Enter a research topic to discover and rank academic papers.",
        connLost: "Connection lost. Is the server running?",
        topicAnalysis: "Topic Analysis", concepts: "Concepts", relatedSystems: "Related systems",
        thesis: "Thesis", foundInDbs: "databases", cites: "cites", untitled: "Untitled",
        link: "Link", pdf: "PDF",
        studyPlan: "Study plan", startHere: "Start here",
        resources: "Related resources", resGithub: "💻 Code", resArticles: "✍️ Articles",
        resVideos: "▶️ Videos", stars: "stars",
        papers: "papers", minCites: "Min cites", source: "Source", sort: "Sort",
        sortScore: "Score", sortCitations: "Citations", sortYear: "Year", exportJson: "Export JSON",
        footer: "open source",
        groups: { most_cited: "🔝 Most cited", newest: "🆕 Newest", top_venues: "🏆 Top venues",
                  theses: "🎓 Theses", open_access: "📥 Open access" },
        stages: { "Foundational": "Foundational", "Core": "Core", "Advanced / Recent": "Advanced / Recent" },
        nodes: {
          starting: "Starting", orchestrator: "Starting pipeline",
          query_analyzer: "Analyzing topic & expanding queries",
          search: "Searching academic sources", metadata: "Enriching metadata",
          analysis: "Scoring & ranking papers", summarizer: "Summarizing top papers",
          prioritizer: "Optimizing reading order", recommender: "Building study plan & groups",
          final: "Finalizing",
        },
        examples: [
          "retrieval augmented generation for question answering",
          "graph neural networks for drug discovery",
          "unit test generation using large language models",
        ],
      },
      tr: {
        subtitle: "Çok ajanlı akademik makale analizi",
        provider: "Sağlayıcı", sources: "Kaynaklar",
        searchPlaceholder: "Bir araştırma konusu yazın…",
        search: "Ara", searching: "Aranıyor…",
        emptyHint: "Akademik makaleleri keşfedip sıralamak için bir araştırma konusu yazın.",
        connLost: "Bağlantı koptu. Sunucu çalışıyor mu?",
        topicAnalysis: "Konu Analizi", concepts: "Kavramlar", relatedSystems: "İlgili sistemler",
        thesis: "Tez", foundInDbs: "veritabanı", cites: "atıf", untitled: "Başlıksız",
        link: "Bağlantı", pdf: "PDF",
        studyPlan: "Çalışma planı", startHere: "Buradan başla",
        resources: "İlgili kaynaklar", resGithub: "💻 Kod", resArticles: "✍️ Yazılar",
        resVideos: "▶️ Videolar", stars: "yıldız",
        papers: "makale", minCites: "Min atıf", source: "Kaynak", sort: "Sırala",
        sortScore: "Puan", sortCitations: "Atıf", sortYear: "Yıl", exportJson: "JSON indir",
        footer: "açık kaynak",
        groups: { most_cited: "🔝 En atıflı", newest: "🆕 En yeni", top_venues: "🏆 Kaliteli dergiler",
                  theses: "🎓 Tezler", open_access: "📥 Açık erişim" },
        stages: { "Foundational": "Temel", "Core": "Çekirdek", "Advanced / Recent": "İleri / Güncel" },
        nodes: {
          starting: "Başlatılıyor", orchestrator: "Pipeline başlatılıyor",
          query_analyzer: "Konu analizi & sorgu genişletme",
          search: "Akademik kaynaklar aranıyor", metadata: "Üst veriler zenginleştiriliyor",
          analysis: "Makaleler puanlanıp sıralanıyor", summarizer: "En iyi makaleler özetleniyor",
          prioritizer: "Okuma sırası iyileştiriliyor", recommender: "Çalışma planı & gruplar oluşturuluyor",
          final: "Tamamlanıyor",
        },
        examples: [
          "büyük dil modelleri ile soru cevaplama",
          "graf sinir ağları ile ilaç keşfi",
          "makine öğrenmesi ile yazılım test üretimi",
        ],
      },
    };

    const I18nContext = createContext(null);
    const useI18n = () => useContext(I18nContext);

    function detectLang() {
      const saved = localStorage.getItem("da_lang");
      if (saved === "en" || saved === "tr") return saved;
      return (navigator.language || "").toLowerCase().startsWith("tr") ? "tr" : "en";
    }

    // -------------------------------------------------------------- helpers ----
    function scoreColor(score) {
      if (score >= 70) return "bg-emerald-500/20 text-emerald-300 border-emerald-500/40";
      if (score >= 50) return "bg-amber-500/20 text-amber-300 border-amber-500/40";
      if (score >= 30) return "bg-sky-500/20 text-sky-300 border-sky-500/40";
      return "bg-slate-500/20 text-slate-300 border-slate-500/40";
    }

    const SOURCE_NAMES = {
      arxiv: "arXiv", semantic_scholar: "Semantic Scholar", openalex: "OpenAlex",
      openalex_thesis: "OpenAlex (thesis)", core: "CORE", pubmed: "PubMed",
      yoktez: "YÖK Tez", crossref: "CrossRef", doaj: "DOAJ", dblp: "DBLP",
      openaire: "OpenAIRE",
    };
    function sourceName(s) { return SOURCE_NAMES[s] || s; }

    const STAGE_STYLE = {
      "Foundational": "bg-emerald-500/15 text-emerald-300 border-emerald-500/30",
      "Core": "bg-sky-500/15 text-sky-300 border-sky-500/30",
      "Advanced / Recent": "bg-purple-500/15 text-purple-300 border-purple-500/30",
    };
    const GROUP_ORDER = ["most_cited", "newest", "top_venues", "theses", "open_access"];

    // ----------------------------------------------------------- components ----
    function LangToggle() {
      const { lang, setLang } = useI18n();
      return (
        <div className="flex rounded-lg overflow-hidden border border-white/15 text-xs">
          {["tr", "en"].map(l => (
            <button key={l} onClick={() => setLang(l)}
              className={"px-2.5 py-1 font-medium " + (lang === l ? "bg-sky-500 text-white" : "bg-white/5 text-slate-300 hover:bg-white/10")}>
              {l.toUpperCase()}
            </button>
          ))}
        </div>
      );
    }

    function Header({ config }) {
      const { t } = useI18n();
      return (
        <header className="border-b border-white/10 bg-white/5 backdrop-blur">
          <div className="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <span className="text-2xl">🎓</span>
              <div>
                <h1 className="text-lg font-semibold">DeepArticle</h1>
                <p className="text-xs text-slate-400">{t.subtitle}</p>
              </div>
            </div>
            <div className="flex items-center gap-4">
              {config && (
                <div className="text-right text-xs text-slate-400 hidden sm:block">
                  <div>{t.provider}: <span className="text-slate-200">{config.provider || "none"}</span></div>
                  <div>{t.sources}: <span className="text-slate-200">{(config.sources || []).join(", ")}</span></div>
                </div>
              )}
              <LangToggle />
            </div>
          </div>
        </header>
      );
    }

    function SearchBar({ onSearch, busy }) {
      const { t } = useI18n();
      const [q, setQ] = useState("");
      return (
        <div className="space-y-3">
          <div className="flex gap-2">
            <input
              value={q}
              onChange={(e) => setQ(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && !busy && q.trim() && onSearch(q.trim())}
              placeholder={t.searchPlaceholder}
              className="flex-1 rounded-xl bg-white/5 border border-white/10 px-4 py-3 outline-none focus:border-sky-400/60"
            />
            <button
              disabled={busy || !q.trim()}
              onClick={() => onSearch(q.trim())}
              className="rounded-xl px-5 py-3 font-medium bg-sky-500 hover:bg-sky-400 disabled:opacity-40 disabled:cursor-not-allowed transition"
            >
              {busy ? t.searching : t.search}
            </button>
          </div>
          <div className="flex flex-wrap gap-2">
            {t.examples.map((ex) => (
              <button key={ex} disabled={busy}
                onClick={() => { setQ(ex); onSearch(ex); }}
                className="text-xs rounded-full px-3 py-1 bg-white/5 border border-white/10 hover:border-sky-400/50 text-slate-300 disabled:opacity-40">
                {ex}
              </button>
            ))}
          </div>
        </div>
      );
    }

    function Pipeline({ progress }) {
      const { t } = useI18n();
      if (!progress) return null;
      const pct = progress.total ? Math.round((progress.step / progress.total) * 100) : 0;
      const label = t.nodes[progress.node] || progress.label || t.nodes.starting;
      return (
        <div className="fade-in rounded-xl bg-white/5 border border-white/10 p-4">
          <div className="flex justify-between text-sm mb-2">
            <span className="text-slate-300">⚙️ {label}…</span>
            <span className="text-slate-400">{progress.step}/{progress.total}</span>
          </div>
          <div className="h-2 rounded-full bg-white/10 overflow-hidden">
            <div className="h-full bg-sky-500 transition-all duration-300" style={{ width: pct + "%" }} />
          </div>
        </div>
      );
    }

    function TopicAnalysis({ analysis }) {
      const { t } = useI18n();
      if (!analysis) return null;
      const { concepts = [], systems = [] } = analysis;
      if (!concepts.length && !systems.length) return null;
      return (
        <div className="rounded-xl bg-white/5 border border-white/10 p-4 text-sm">
          <h3 className="font-medium mb-2 text-slate-200">🔬 {t.topicAnalysis}</h3>
          {concepts.length > 0 && <p className="text-slate-400 mb-1"><b className="text-slate-300">{t.concepts}:</b> {concepts.slice(0,6).join(", ")}</p>}
          {systems.length > 0 && <p className="text-slate-400"><b className="text-slate-300">{t.relatedSystems}:</b> {systems.slice(0,8).join(", ")}</p>}
        </div>
      );
    }

    function PaperCard({ p, rank }) {
      const { t } = useI18n();
      const score = p.total_score || 0;
      const year = (p.published_date || "").slice(0, 4);
      const venue = p.venue || p.journal_name || "";
      const authors = (p.authors || []).slice(0, 3).join(", ") + ((p.authors || []).length > 3 ? ` +${p.authors.length - 3}` : "");
      const dbList = (p.found_in && p.found_in.length) ? p.found_in : (p.source ? [p.source] : []);
      const links = (p.source_links || []).filter(l => l.url);
      const pdfLinks = (p.source_links || []).filter(l => l.pdf_url && l.pdf_url !== l.url);
      return (
        <div className="fade-in rounded-xl bg-white/5 border border-white/10 p-4 hover:border-white/20 transition">
          <div className="flex items-start gap-3">
            <div className="text-slate-500 font-mono text-sm pt-1">#{rank}</div>
            <div className="flex-1 min-w-0">
              <div className="flex items-start justify-between gap-3">
                <h3 className="font-medium leading-snug">
                  {p.is_thesis && <span className="text-xs mr-1 px-1.5 py-0.5 rounded bg-purple-500/20 text-purple-300 border border-purple-400/30">🎓 {t.thesis}</span>}
                  {p.title || t.untitled}
                </h3>
                <span className={"shrink-0 text-xs px-2 py-1 rounded-lg border " + scoreColor(score)}>
                  {score.toFixed(1)}
                </span>
              </div>
              {authors && <p className="text-xs text-slate-400 mt-1">👤 {authors}</p>}
              <p className="text-xs text-slate-400 mt-1">
                {year && <span>📅 {year} </span>}
                {venue && <span>· 📰 {venue} </span>}
                {p.q_quartile && <span className="text-emerald-300">· {p.q_quartile} </span>}
                <span>· 📈 {p.citation_count || 0} {t.cites}</span>
                {p.relevance_score ? <span> · 🎯 {Math.round(p.relevance_score)}%</span> : null}
              </p>
              {dbList.length > 1 && (
                <p className="text-xs text-amber-300/90 mt-1">🗂️ {dbList.length} {t.foundInDbs}: {dbList.map(s => sourceName(s)).join(", ")}</p>
              )}
              {p.summary && <p className="text-sm text-slate-300 mt-2">{p.summary.slice(0, 260)}{p.summary.length > 260 ? "…" : ""}</p>}
              <div className="flex flex-wrap gap-3 mt-2 text-xs items-center">
                {links.map((l, idx) => (
                  <a key={idx} className="text-sky-400 hover:underline" href={l.url} target="_blank">🔗 {sourceName(l.source)}</a>
                ))}
                {links.length === 0 && p.url && <a className="text-sky-400 hover:underline" href={p.url} target="_blank">🔗 {t.link}</a>}
                {pdfLinks.map((l, idx) => (
                  <a key={"pdf"+idx} className="text-emerald-400 hover:underline" href={l.pdf_url} target="_blank">📥 {t.pdf} ({sourceName(l.source)})</a>
                ))}
                {p.doi && <span className="text-slate-500">DOI: {p.doi}</span>}
              </div>
            </div>
          </div>
        </div>
      );
    }

    function StudyPlan({ readingPath, startHere, byId }) {
      const { t } = useI18n();
      if (!readingPath || !readingPath.length) return null;
      return (
        <div className="rounded-xl bg-gradient-to-br from-sky-500/10 to-purple-500/10 border border-white/10 p-4">
          <h3 className="font-semibold text-sky-300 flex items-center gap-2">🧭 {t.studyPlan}</h3>
          {startHere && (
            <p className="text-sm text-slate-300 mt-2">
              <span className="text-emerald-300 font-medium">▶ {t.startHere}:</span>{" "}
              {startHere.title}{startHere.reason ? <span className="text-slate-400"> — {startHere.reason}</span> : null}
            </p>
          )}
          <ol className="mt-3 space-y-2">
            {readingPath.map((s, i) => {
              const p = byId[s.paper_id];
              return (
                <li key={i} className="flex items-start gap-2 text-sm">
                  <span className="text-slate-500 font-mono">{i + 1}.</span>
                  <span className={"shrink-0 text-xs px-1.5 py-0.5 rounded border " + (STAGE_STYLE[s.stage] || "border-white/20 text-slate-300")}>{t.stages[s.stage] || s.stage}</span>
                  <span className="min-w-0">
                    {p && p.url ? <a className="text-sky-300 hover:underline" href={p.url} target="_blank">{s.title}</a> : (s.title || "—")}
                    {s.reason ? <span className="text-slate-400"> — {s.reason}</span> : null}
                  </span>
                </li>
              );
            })}
          </ol>
        </div>
      );
    }

    function Groups({ groups, byId }) {
      const { t } = useI18n();
      const avail = GROUP_ORDER.filter(k => (groups[k] || []).length);
      const [tab, setTab] = useState(avail.length ? avail[0] : null);
      useEffect(() => { if (avail.length && !avail.includes(tab)) setTab(avail[0]); }, [groups]);
      if (!avail.length) return null;
      const ids = groups[tab] || [];
      return (
        <div className="rounded-xl bg-white/5 border border-white/10 p-4">
          <div className="flex flex-wrap gap-2 mb-3">
            {avail.map(k => (
              <button key={k} onClick={() => setTab(k)}
                className={"text-xs px-2.5 py-1 rounded-lg border " + (tab === k ? "bg-sky-500/20 text-sky-300 border-sky-400/40" : "bg-white/5 text-slate-400 border-white/10 hover:border-white/20")}>
                {t.groups[k]} ({(groups[k] || []).length})
              </button>
            ))}
          </div>
          <ul className="space-y-1.5 text-sm">
            {ids.map((id, i) => {
              const p = byId[id];
              if (!p) return null;
              return (
                <li key={id} className="flex items-start gap-2">
                  <span className="text-slate-500 font-mono">{i + 1}.</span>
                  <span className="min-w-0">
                    {p.url ? <a className="text-sky-300 hover:underline" href={p.url} target="_blank">{p.title}</a> : p.title}
                    <span className="text-slate-500 text-xs"> · {p.citation_count || 0} {t.cites}{(p.published_date || "").slice(0,4) ? " · " + (p.published_date||"").slice(0,4) : ""}</span>
                  </span>
                </li>
              );
            })}
          </ul>
        </div>
      );
    }

    function Resources({ resources }) {
      const { t } = useI18n();
      const r = resources || {};
      const github = r.github || [], articles = r.articles || [], videos = r.videos || [];
      if (!github.length && !articles.length && !videos.length) return null;
      return (
        <div className="rounded-xl bg-white/5 border border-white/10 p-4 space-y-3">
          <h3 className="font-semibold text-slate-200">🌐 {t.resources}</h3>
          {github.length > 0 && (
            <div>
              <p className="text-xs text-slate-400 mb-1">{t.resGithub}</p>
              <ul className="space-y-1 text-sm">
                {github.map((g, i) => (
                  <li key={i} className="min-w-0">
                    <a className="text-sky-300 hover:underline" href={g.url} target="_blank">{g.name}</a>
                    <span className="text-amber-300/90 text-xs"> · ⭐ {g.stars.toLocaleString()} {t.stars}</span>
                    {g.language ? <span className="text-slate-500 text-xs"> · {g.language}</span> : null}
                    {g.description ? <span className="text-slate-400 text-xs"> — {g.description.slice(0, 80)}</span> : null}
                  </li>
                ))}
              </ul>
            </div>
          )}
          {articles.length > 0 && (
            <div>
              <p className="text-xs text-slate-400 mb-1">{t.resArticles}</p>
              <ul className="space-y-1 text-sm">
                {articles.map((a, i) => (
                  <li key={i} className="min-w-0">
                    <a className="text-sky-300 hover:underline" href={a.url} target="_blank">{a.title}</a>
                    {a.author ? <span className="text-slate-500 text-xs"> · {a.author}</span> : null}
                  </li>
                ))}
              </ul>
            </div>
          )}
          {videos.length > 0 && (
            <div>
              <p className="text-xs text-slate-400 mb-1">{t.resVideos}</p>
              <ul className="space-y-1 text-sm">
                {videos.map((v, i) => (
                  <li key={i} className="min-w-0">
                    <a className="text-sky-300 hover:underline" href={v.url} target="_blank">{v.title}</a>
                    {v.channel ? <span className="text-slate-500 text-xs"> · {v.channel}</span> : null}
                  </li>
                ))}
              </ul>
            </div>
          )}
        </div>
      );
    }

    function Results({ papers, analysis, groups, readingPath, startHere, resources }) {
      const { t } = useI18n();
      const [minCites, setMinCites] = useState(0);
      const [source, setSource] = useState("all");
      const [sortBy, setSortBy] = useState("score");

      const byId = useMemo(() => Object.fromEntries(papers.map(p => [p.paper_id, p])), [papers]);
      const sources = useMemo(() => ["all", ...Array.from(new Set(papers.map(p => p.source)))], [papers]);
      const view = useMemo(() => {
        let v = papers.filter(p => (p.citation_count || 0) >= minCites && (source === "all" || p.source === source));
        v = [...v].sort((a, b) => sortBy === "citations"
          ? (b.citation_count || 0) - (a.citation_count || 0)
          : sortBy === "year"
          ? (b.published_date || "").localeCompare(a.published_date || "")
          : (b.total_score || 0) - (a.total_score || 0));
        return v;
      }, [papers, minCites, source, sortBy]);

      function exportJson() {
        const blob = new Blob([JSON.stringify(view, null, 2)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "deeparticle_results.json";
        a.click();
      }

      if (!papers.length) return null;
      return (
        <div className="space-y-4">
          <TopicAnalysis analysis={analysis} />
          <StudyPlan readingPath={readingPath} startHere={startHere} byId={byId} />
          <Groups groups={groups || {}} byId={byId} />
          <Resources resources={resources} />
          <div className="flex flex-wrap items-center gap-3 text-sm">
            <span className="text-slate-400">{view.length} {t.papers}</span>
            <label className="flex items-center gap-1 text-slate-400">{t.minCites}
              <input type="number" min="0" value={minCites} onChange={e => setMinCites(+e.target.value || 0)}
                className="w-20 rounded bg-white/5 border border-white/10 px-2 py-1" />
            </label>
            <label className="flex items-center gap-1 text-slate-400">{t.source}
              <select value={source} onChange={e => setSource(e.target.value)} className="rounded bg-white/5 border border-white/10 px-2 py-1">
                {sources.map(s => <option key={s} value={s} className="bg-slate-800">{s === "all" ? "all" : sourceName(s)}</option>)}
              </select>
            </label>
            <label className="flex items-center gap-1 text-slate-400">{t.sort}
              <select value={sortBy} onChange={e => setSortBy(e.target.value)} className="rounded bg-white/5 border border-white/10 px-2 py-1">
                <option value="score" className="bg-slate-800">{t.sortScore}</option>
                <option value="citations" className="bg-slate-800">{t.sortCitations}</option>
                <option value="year" className="bg-slate-800">{t.sortYear}</option>
              </select>
            </label>
            <button onClick={exportJson} className="ml-auto rounded-lg px-3 py-1 bg-white/5 border border-white/10 hover:border-sky-400/50">⬇ {t.exportJson}</button>
          </div>
          <div className="space-y-3">
            {view.map((p, i) => <PaperCard key={p.paper_id || i} p={p} rank={i + 1} />)}
          </div>
        </div>
      );
    }

    function App() {
      const [lang, setLangState] = useState(detectLang());
      const setLang = (l) => { localStorage.setItem("da_lang", l); setLangState(l); };
      const t = STRINGS[lang];

      const [config, setConfig] = useState(null);
      const [busy, setBusy] = useState(false);
      const [progress, setProgress] = useState(null);
      const [papers, setPapers] = useState([]);
      const [analysis, setAnalysis] = useState(null);
      const [groups, setGroups] = useState({});
      const [readingPath, setReadingPath] = useState([]);
      const [startHere, setStartHere] = useState(null);
      const [resources, setResources] = useState({});
      const [error, setError] = useState(null);
      const esRef = useRef(null);

      useEffect(() => {
        document.documentElement.lang = lang;
      }, [lang]);

      useEffect(() => {
        fetch("/api/config").then(r => r.json()).then(setConfig).catch(() => {});
      }, []);

      function search(query) {
        setBusy(true); setError(null); setPapers([]); setAnalysis(null);
        setGroups({}); setReadingPath([]); setStartHere(null); setResources({});
        setProgress({ node: "starting", step: 0, total: 10 });
        if (esRef.current) esRef.current.close();

        const es = new EventSource("/api/search/stream?query=" + encodeURIComponent(query));
        esRef.current = es;
        es.onmessage = (e) => {
          const msg = JSON.parse(e.data);
          if (msg.type === "progress") setProgress({ node: msg.node, label: msg.label, step: msg.step, total: msg.total });
          else if (msg.type === "result") {
            setPapers(msg.papers || []); setAnalysis(msg.topic_analysis);
            setGroups(msg.groups || {}); setReadingPath(msg.reading_path || []); setStartHere(msg.start_here || null);
            setResources(msg.resources || {});
          }
          else if (msg.type === "error") setError(msg.message);
          else if (msg.type === "done") { setBusy(false); setProgress(null); es.close(); }
        };
        es.onerror = () => { setBusy(false); setProgress(null); setError(t.connLost); es.close(); };
      }

      return (
        <I18nContext.Provider value={{ t, lang, setLang }}>
          <div className="min-h-screen">
            <Header config={config} />
            <main className="max-w-5xl mx-auto px-4 py-8 space-y-6">
              <SearchBar onSearch={search} busy={busy} />
              <Pipeline progress={progress} />
              {error && <div className="rounded-xl bg-red-500/10 border border-red-500/30 text-red-300 p-4 text-sm">⚠ {error}</div>}
              {!busy && !papers.length && !error && (
                <div className="text-center text-slate-500 py-16">
                  <p className="text-4xl mb-3">🔍</p>
                  <p>{t.emptyHint}</p>
                </div>
              )}
              <Results papers={papers} analysis={analysis} groups={groups} readingPath={readingPath} startHere={startHere} resources={resources} />
            </main>
            <footer className="text-center text-xs text-slate-600 py-8">
              DeepArticle · {t.footer} · MIT
            </footer>
          </div>
        </I18nContext.Provider>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
